<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Ilustración del eje intestino-cerebro: un cerebro y un intestino unidos por dos flechas que van en los dos sentidos">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF5FA"/>
      <stop offset="1" stop-color="#DBE6EE"/>
    </linearGradient>
    <linearGradient id="ic-cerebro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8B2A9"/>
      <stop offset="1" stop-color="#DE6553"/>
    </linearGradient>
    <filter id="ic-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#22323F" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ic-bg)"/>
  <ellipse cx="300" cy="200" rx="258" ry="166" fill="#fff" opacity=".52"/>
  <ellipse cx="300" cy="200" rx="258" ry="166" fill="none" stroke="#9FC4DC" stroke-width="2.5" stroke-dasharray="10 13" opacity=".75"/>

  <!-- cerebro, a la izquierda -->
  <g transform="translate(-140,52)" filter="url(#ic-sombra)">
    <path d="M232 104c-6-26 16-44 40-38 12-18 44-20 58-4 28-8 50 12 48 36 18 12 18 40-2 50 2 22-20 36-42 30-16 14-46 12-56-4-24 2-42-16-38-38-10-8-12-24-8-32z" fill="url(#ic-cerebro)"/>
    <g stroke="#B8402F" stroke-width="5.5" stroke-linecap="round" fill="none" opacity=".5">
      <path d="M268 72c-10 10-6 22 4 26s8 18-4 22M312 62c-8 12 2 22 12 22s12 14 2 22M352 78c-12 6-10 20 0 26s6 20-6 22M254 128c12 4 26-2 32 6M330 142c10-6 24-4 32 4"/>
    </g>
    <path d="M330 156c18-2 32 8 32 22 0 10-8 18-20 18-14 0-26-10-26-22 0-10 6-17 14-18z" fill="#D9594A"/>
    <path d="M298 162c5 20 8 36 6 52h-17c2-18 2-34-3-52z" fill="#E8897B"/>
  </g>

  <!-- intestino, a la derecha -->
  <g transform="translate(152,-92)" filter="url(#ic-sombra)">
    <path d="M222 348v-60a26 26 0 0 1 26-26h104a26 26 0 0 1 26 26v60" fill="none" stroke="#D4543F" stroke-width="27" stroke-linecap="round"/>
    <g fill="none" stroke="#F0887A" stroke-width="17" stroke-linecap="round">
      <path d="M258 300c16-16 32 10 48-6s32 10 44-6"/>
      <path d="M258 336c16-16 32 10 48-6s32 10 44-6"/>
    </g>
  </g>

  <!-- las dos direcciones del eje -->
  <g fill="none" stroke="#0072BB" stroke-width="12" stroke-linecap="round">
    <path d="M246 150q52-24 100-2"/>
    <path d="M354 254q-52 24-100 2"/>
  </g>
  <g fill="#0072BB">
    <path d="M372 152l-24 11v-22z"/>
    <path d="M228 252l24-11v22z"/>
  </g>
</svg>
