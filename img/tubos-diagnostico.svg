<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Ilustración de una gradilla con tubos de muestra de tapas de colores y un tubo con código de barras en primer plano">
  <defs>
    <linearGradient id="td-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4F9"/>
      <stop offset="1" stop-color="#D7E3EC"/>
    </linearGradient>
    <linearGradient id="td-vidrio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9FB4C4" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="td-sangre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A32B26"/>
      <stop offset=".4" stop-color="#7E1818"/>
      <stop offset="1" stop-color="#5C0F10"/>
    </linearGradient>
    <linearGradient id="td-gradilla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFEFE"/>
      <stop offset="1" stop-color="#C9D6E0"/>
    </linearGradient>
    <filter id="td-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#213140" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#td-bg)"/>

  <!-- tubos en la gradilla -->
  <g filter="url(#td-sombra)">
    <g id="td-fila">
      <g transform="translate(172,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#D8453A"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 226h34v52a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(218,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#F5C542"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 238h34v40a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(264,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#27ADE3"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 220h34v58a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(310,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#9B8BD0"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 232h34v46a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(356,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#D8453A"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 224h34v54a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(402,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#4FC08D"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 240h34v38a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
      <g transform="translate(448,0)"><rect x="0" y="130" width="34" height="26" rx="6" fill="#27ADE3"/><path d="M0 152h34v126a17 17 0 0 1-34 0z" fill="url(#td-vidrio)"/><path d="M0 228h34v50a17 17 0 0 1-34 0z" fill="url(#td-sangre)"/></g>
    </g>

    <!-- gradilla -->
    <rect x="146" y="244" width="360" height="22" rx="8" fill="url(#td-gradilla)"/>
    <rect x="146" y="244" width="360" height="22" rx="8" fill="none"/>
    <rect x="158" y="266" width="336" height="76" rx="13" fill="url(#td-gradilla)"/>
    <rect x="158" y="266" width="336" height="76" rx="13" fill="#5E7589" opacity=".12"/>
    <rect x="158" y="300" width="336" height="9" rx="4" fill="#9FB3C2" opacity=".45"/>
    <rect x="172" y="342" width="56" height="14" rx="6" fill="#B9C8D4"/>
    <rect x="424" y="342" width="56" height="14" rx="6" fill="#B9C8D4"/>
  </g>

  <!-- tubo en primer plano, con etiqueta y código de barras -->
  <g transform="rotate(-26 150 190)" filter="url(#td-sombra)">
    <rect x="116" y="74" width="42" height="30" rx="7" fill="#D8453A"/>
    <path d="M116 100h42v170a21 21 0 0 1-42 0z" fill="url(#td-vidrio)"/>
    <path d="M116 206h42v64a21 21 0 0 1-42 0z" fill="url(#td-sangre)"/>
    <rect x="114" y="120" width="46" height="78" rx="3" fill="#FBFCFD"/>
    <g fill="#243441">
      <rect x="120" y="127" width="3" height="64"/><rect x="126" y="127" width="5" height="64"/>
      <rect x="134" y="127" width="2" height="64"/><rect x="139" y="127" width="4" height="64"/>
      <rect x="146" y="127" width="2" height="64"/><rect x="151" y="127" width="5" height="64"/>
    </g>
    <path d="M122 104h8v164a4 4 0 0 1-8 0z" fill="#fff" opacity=".5"/>
  </g>
</svg>
